<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>過去のイベントデータ | ホロライブドリームス ポイント計算機</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="history.css">
</head>
<body data-theme="light">
  <header class="site-header">
    <div class="header-copy">
      <h1>過去のイベントデータ</h1>
      <p>イベントごとのデータを参照します。</p>
    </div>
  </header>

  <main class="calculator history-calculator">
    <nav class="site-page-tabs history-page-nav" aria-label="ページ移動">
      <a class="site-page-tab" href="index.html">イベントポイント計算機</a>
    </nav>

    <nav class="site-page-tabs history-event-tabs" aria-label="イベント切り替え">
      <button class="site-page-tab is-active" type="button" aria-pressed="true" data-event="rally">ポイントラリー</button>
      <button class="site-page-tab" type="button" aria-pressed="false" data-event="spotlight">スポットライト</button>
    </nav>

    <section id="history-panel" class="history-panel" role="tabpanel" aria-label="過去のイベントデータ" tabindex="0">
      <div class="history-results-panel">
        <p id="history-data-warning" class="history-message is-warning" role="alert" hidden></p>
        <p id="history-theme-message" class="history-message" role="status" hidden></p>
        <table class="history-table">
          <caption class="history-visually-hidden">イベント名またはキャラクター名とポイントを表示します。</caption>
          <colgroup>
            <col class="history-rank-column">
            <col class="history-name-column">
            <col class="history-points-column">
          </colgroup>
          <tbody class="history-controls-row">
            <tr>
              <td colspan="3">
                <div class="history-controls">
                  <label class="history-tier-control" for="history-tier">
                    <select id="history-tier" aria-label="表示対象">
                      <option value="dream">ドリーム</option>
                      <option value="diamond">ダイヤ</option>
                      <option value="platinum">プラチナ</option>
                    </select>
                  </label>
                  <label class="history-sort-control" for="history-sort">
                    <span class="history-visually-hidden">並び順</span>
                    <select id="history-sort">
                      <option value="order">開催順</option>
                      <option value="points-desc" selected>ポイントが高い順</option>
                      <option value="points-asc">ポイントが低い順</option>
                    </select>
                  </label>
                </div>
              </td>
            </tr>
          </tbody>
          <tbody id="history-ranking"></tbody>
        </table>
        <p id="history-empty" class="history-empty" role="status">データがありません</p>
      </div>
    </section>
  </main>

  <script src="data/rally-data.js"></script>
  <script src="data/spotlight-data.js"></script>
  <script src="history.js"></script>
</body>
</html>
